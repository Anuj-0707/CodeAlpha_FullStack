<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SocialSphere</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><div class="auth-card"><a class="logo" href="index.html">SocialSphere</a><h1>Create your profile</h1><p class="muted">It only takes a minute.</p><form id="registerForm"><label>Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="6" required><button class="btn full">Register</button><p id="message" class="message"></p></form><p>Already registered? <a href="login.html">Login</a></p></div><script src="js/auth.js"></script></body></html>
